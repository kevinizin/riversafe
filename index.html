  :root {
    --ink: #170b10;
    --wine: #2c0f1a;
    --wine-soft: #3f1826;
    --rose: #d8536f;
    --rose-dim: #a83f57;
    --gold: #cda05f;
    --cream: #f3e6da;
    --stage: var(--ink);
    --surface: var(--wine);
    --text: var(--cream);
    --text-dim: #cbaab0;
    --accent: var(--rose);
    --accent-2: var(--gold);
    --btn-text: var(--ink);
  }

  :root[data-theme="light"] {
    --stage: #f6e9df;
    --surface: #fbf2ea;
    --text: #3a1220;
    --text-dim: #86505f;
    --accent: #b8395a;
    --accent-2: #a97c3d;
    --btn-text: #f6e9df;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --stage: #f6e9df;
      --surface: #fbf2ea;
      --text: #3a1220;
      --text-dim: #86505f;
      --accent: #b8395a;
      --accent-2: #a97c3d;
      --btn-text: #f6e9df;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--stage);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100dvh;
    background:
      radial-gradient(ellipse at 50% 30%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
      var(--stage);
    transition: background-color 0.6s ease;
  }

  .phrase-field {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .phrase {
    position: absolute;
    top: 100%;
    white-space: nowrap;
    font-style: italic;
    font-weight: 600;
    color: var(--text-dim);
    opacity: 0;
    letter-spacing: 0.01em;
    animation-name: rise;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    will-change: transform, opacity;
  }

  @keyframes rise {
    0%   { opacity: 0; transform: translate(-50%, 0); }
    8%   { opacity: 0.55; }
    88%  { opacity: 0.4; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--drift, 0px)), -115vh); }
  }

  #startBtn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--btn-text);
    background: linear-gradient(155deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: 999px;
    padding: 1.05rem 3rem;
    cursor: pointer;
    box-shadow: 0 10px 30px -8px color-mix(in srgb, var(--accent) 65%, transparent);
    transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.6s ease;
  }

  #startBtn:hover {
    transform: translate(-50%, -50%) translateY(-2px);
    box-shadow: 0 14px 36px -8px color-mix(in srgb, var(--accent) 75%, transparent);
  }

  #startBtn:focus-visible {
    outline: 2px solid var(--accent-2);
    outline-offset: 4px;
  }

  #startBtn.hide {
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.9);
  }

  .center-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    text-align: center;
    padding: 0 1.5rem;
    width: 100%;
  }

  .headline {
    margin: 0;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(3rem, 15vw, 6.5rem);
    line-height: 1;
    color: var(--text);
    text-wrap: balance;
    opacity: 0;
    filter: blur(6px);
    transform: translateY(14px) scale(0.96);
    text-shadow: 0 0 40px color-mix(in srgb, var(--accent-2) 45%, transparent);
    transition: opacity 1.4s ease 0.15s, filter 1.4s ease 0.15s, transform 1.4s ease 0.15s;
  }

  .headline.show {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0) scale(1);
  }

  .headline .heart {
    display: inline-block;
    font-style: normal;
    color: var(--accent);
    -webkit-text-fill-color: var(--accent);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.14); }
  }

  .sub {
    margin: 0.9rem 0 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--text-dim);
    opacity: 0;
    transition: opacity 1.2s ease 1.1s;
  }

  .sub.show { opacity: 0.85; }

  @media (prefers-reduced-motion: reduce) {
    .phrase { animation: none; opacity: 0.45; top: var(--fixed-top, 20%); transform: translateX(-50%); }
    #startBtn, .headline, .sub { transition-duration: 0.3s; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="phrase-field" id="phraseField"></div>
  <button id="startBtn">Iniciar</button>
  <div class="center-wrap">
    <h1 class="headline" id="headline">Eu te amo <span class="heart">&#10084;</span></h1>
    <p class="sub" id="sub">hoje, amanh&atilde; e sempre</p>
  </div>
</div>

<script>
  const PHRASES = [
    "você é meu lugar favorito",
    "minha pessoa preferida",
    "te escolho todos os dias",
    "meu coração é seu",
    "para sempre com você",
    "você é o meu presente",
    "comigo, sempre",
    "meu amor por você só cresce",
    "você é a minha paz",
    "eu te amo mais hoje que ontem",
    "minha melhor história é com você",
    "você é o meu lugar seguro"
  ];

  const btn = document.getElementById('startBtn');
  const field = document.getElementById('phraseField');
  const headline = document.getElementById('headline');
  const sub = document.getElementById('sub');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let spawnTimer = null;

  function spawnPhrase(initial) {
    const el = document.createElement('div');
    el.className = 'phrase';
    el.textContent = PHRASES[Math.floor(Math.random() * PHRASES.length)];

    const text = el.textContent;
    const lengthFactor = Math.max(0, (text.length - 14) * 0.028);
    const size = Math.max(0.78, (0.95 + Math.random() * 0.75) - lengthFactor);
    const left = Math.random() * 50 + 25;
    const duration = 9 + Math.random() * 7;
    const drift = (Math.random() - 0.5) * 70;

    el.style.left = left + '%';
    el.style.fontSize = size + 'rem';
    el.style.setProperty('--drift', drift + 'px');
    el.style.animationDuration = duration + 's';

    if (reduceMotion) {
      el.style.setProperty('--fixed-top', (10 + Math.random() * 70) + '%');
    } else if (initial) {
      el.style.animationDelay = (-Math.random() * duration) + 's';
    }

    field.appendChild(el);
    setTimeout(() => el.remove(), (duration + 1) * 1000);
  }

  btn.addEventListener('click', () => {
    btn.classList.add('hide');

    for (let i = 0; i < 6; i++) spawnPhrase(true);
    spawnTimer = setInterval(() => spawnPhrase(false), 1100);

    requestAnimationFrame(() => {
      headline.classList.add('show');
      sub.classList.add('show');
    });
  });
</script>
</body>
</html>
